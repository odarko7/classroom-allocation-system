services:
  - type: web
    name: classroom-allocation
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && cd ../frontend && npm ci --include=dev --no-audit --no-fund && npm run build && cd ../backend
    startCommand: node src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
